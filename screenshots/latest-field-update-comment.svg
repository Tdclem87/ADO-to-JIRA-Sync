<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Jira field update comment, version 1.1.0</title>
  <desc id="desc">Sanitized Jira field-update comment with a clear heading, regular-weight details, and a muted sync-reference footer.</desc>
  <rect width="1400" height="800" fill="#111820"/>
  <rect x="24" y="24" width="1352" height="752" rx="8" fill="#171f29" stroke="#354252" stroke-width="2"/>
  <rect x="24" y="24" width="1352" height="58" rx="8" fill="#202b37"/>
  <circle cx="54" cy="53" r="7" fill="#ff6b64"/>
  <circle cx="80" cy="53" r="7" fill="#f4bd50"/>
  <circle cx="106" cy="53" r="7" fill="#60c689"/>
  <text x="700" y="60" text-anchor="middle" fill="#aab7c5" font-family="Consolas, 'Courier New', monospace" font-size="18">Example Jira field update comment</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="20" xml:space="preserve">
    <text x="58" y="140" fill="#f2f5f7" font-size="25" font-weight="700">Azure DevOps field update</text>
    <text x="58" y="184" fill="#f2f5f7">Work item: 1001</text>
    <text x="58" y="218" fill="#f2f5f7">Revision: 8</text>
    <text x="58" y="264" fill="#f2f5f7">Changed by: Alex Example</text>
    <text x="58" y="298" fill="#f2f5f7">Changed: 2026-10-09 10:30:00 UTC</text>
    <text x="58" y="352" fill="#f2f5f7">Updated fields:</text>
    <text x="58" y="390" fill="#f2f5f7">System.Description: Requirements: Update the registration form. -&gt;</text>
    <text x="58" y="422" fill="#f2f5f7">Requirements: Add an optional contact field.</text>
    <text x="58" y="458" fill="#f2f5f7">System.AssignedTo: (empty) -&gt; Alex Example</text>
  </g>
  <text x="58" y="530" fill="#728293" font-family="Consolas, 'Courier New', monospace" font-size="16">Sync reference: ADO_TO_JIRA_FIELDS:a1b2c3d4e5f607182930</text>
  <text x="58" y="735" fill="#728293" font-family="Consolas, 'Courier New', monospace" font-size="16" letter-spacing="1">SANITIZED EXAMPLE | NO REAL CREDENTIALS OR WORK ITEM DATA</text>
</svg>
